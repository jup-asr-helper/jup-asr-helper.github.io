name: Test and verify published assets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Test transaction validation
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Verify committed Pages assets match source
        run: |
          test -f .nojekyll
          cmp dist/index.html index.html
          cmp dist/app.js app.js
          cmp dist/style.css style.css
          cmp dist/asset-manifest.json asset-manifest.json
          for asset in dist/assets/*; do cmp "$asset" "${asset#dist/}"; done
